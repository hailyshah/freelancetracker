<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Tracker</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1b19;--mut:#7a746c;--line:#e8e3dc;--acc:#e4572e;--ok:#2e8b57;--warn:#d98e04;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#f2eee8;--mut:#9b948a;--line:#34302b}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#f2eee8;--mut:#9b948a;--line:#34302b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
main,header{max-width:1020px;margin:0 auto;padding:12px 16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:24px 0 8px}h3{margin:0 0 12px}
.top,.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}.bar{justify-content:flex-start;margin:8px 0}
nav{display:flex;gap:6px;margin-top:10px}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:default}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button .tag{color:var(--ink)}button.t{background:transparent;color:var(--mut);padding:4px 7px}
button.t:hover{color:var(--ink)}button.d:hover{color:var(--bad)}
nav button{background:transparent;color:var(--mut);border:1px solid var(--line)}nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,input{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px}.mut{color:var(--mut);font-size:13px}.sp{flex:1}
.rem{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;border-left:4px solid var(--line)}
.rem.over{border-left-color:var(--bad)}.rem.soon{border-left-color:var(--warn)}.rem.later{border-left-color:var(--ok)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.ok{background:#2e8b5722;color:var(--ok)}.tag.w{background:#d98e0426;color:var(--warn)}
.wrap{overflow-x:auto;padding:4px 8px}table{border-collapse:collapse;width:100%;min-width:660px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut)}
tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}tfoot td{font-weight:700}
.empty{text-align:center;color:var(--mut);padding:22px}.ck{cursor:pointer}.ck:hover{border-color:var(--acc)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(430px,92vw)}
dialog::backdrop{background:#0006}label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
dialog input,dialog select{display:block;width:100%;margin-top:3px;color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:9}
#toast button{background:transparent;color:var(--acc);padding:0;font-weight:700}
.banner{background:#d98e0422;border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details{margin:12px 0}summary{cursor:pointer;color:var(--mut)}
header{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);max-width:none;padding:10px 16px}header>*{max-width:988px;margin-left:auto;margin-right:auto}
.cnt{font-size:11px;background:var(--line);color:var(--ink);border-radius:99px;padding:1px 7px;margin-left:3px}.cnt.hot{background:var(--bad);color:#fff}
nav button.on .cnt{background:#fff3;color:inherit}
.menu{position:relative}.menu summary{list-style:none;background:var(--acc);color:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:#fff}.menu summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:150px;z-index:8}.menu>div button{text-align:left}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 -2px}.legend{margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lk{color:var(--acc);text-decoration:none;font-weight:600}.lk:hover{text-decoration:underline}.crumb{margin-bottom:6px}
.jump{position:sticky;top:96px;z-index:4;background:var(--bg);padding:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.jump button{padding:4px 10px}
h2[id],.card[id]{scroll-margin-top:150px}.stat.ck{cursor:pointer}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
select.pill{padding:4px 8px;cursor:pointer}option{background:var(--card);color:var(--ink)}
.pp-Pending{background:#fde2e2;color:#b42318}.pp-Invoicesent{background:#fff1b8;color:#8a6100}.pp-Received{background:#d3f5df;color:#17713f}.pp-NA{background:#ececea;color:#6b655d}
.ps-Notstarted{background:#9b1c1c;color:#fff}.ps-Onhold{background:#c2410c;color:#fff}.ps-Inprogress{background:#a16207;color:#fff}.ps-Completed{background:#166534;color:#fff}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<header><div class="top"><h1>🧾 Studio Tracker</h1><span id="sv" class="mut"></span><span id="acct"></span><div class="bar" style="margin:0">
<button class="g" onclick="exp()" title="Download all your data as a file">⬇ Backup</button>
<details id="newm" class="menu"><summary>＋ New</summary><div><button class="g" onclick="nw('project')">📁 Project</button><button class="g" onclick="nw('client')">👥 Client</button><button class="g" onclick="nw('entry')">🧩 Work entry</button></div></details>
<button class="g" onclick="$('#imp').click()" title="Load a backup file">⬆ Restore</button>
<input type="file" id="imp" accept=".json" hidden onchange="imp(this)"></div></div><nav id="nav"></nav></header>
<main id="app"></main><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const ml=m=>new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
const mopts=(arr,sel)=>'<option value="all">All months</option>'+[...new Set(arr.map(d=>d.slice(0,7)))].sort().reverse().map(m=>`<option value="${m}" ${m==sel?'selected':''}>${ml(m)}</option>`).join('');
const opts=(a,sel)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`}).join('');
const KEY='studio-tracker-v1',SEED=null;
const CYC={monthly:'Every month',bimonthly:'Every 2 months',project:'When a project ends'};
const PF=[['all','All'],['unpaid','Unpaid'],['awaiting','Invoice sent · awaiting payment'],['uninv','Done, not invoiced yet'],['hold','On hold'],['ns','Not started']];
const pm={all:p=>1,unpaid:p=>OPEN(p),awaiting:p=>p.invoiced&&OPEN(p),uninv:p=>p.status=='Completed'&&!p.invoiced&&p.payment=='Pending'&&p.amount>0,hold:p=>p.status=='On hold',ns:p=>p.status=='Not started'};
const OPEN=p=>(p.payment=='Pending'||p.payment=='Invoice sent')&&p.amount>0;
const ST=['Not started','In progress','On hold','Completed'],PAY=['Pending','Invoice sent','Received','N/A'];
let S=null,view='dash',cur=null,mf='all',bf='all',pf={m:'all',c:'all',s:'All',q:'',f:'all'},mem=false,tt;
S={clients:[],projects:[],entries:[],invoices:[],meta:{}};
try{const j=localStorage.getItem(KEY);if(j)S=Object.assign(S,JSON.parse(j))}catch(e){mem=true}
const cn=id=>(S.clients.find(c=>c.id==id)||{}).name||'—';
function sv(m,bad){const e=$('#sv');if(e){e.textContent=m;e.style.color=bad?'var(--bad)':'var(--mut)'}}
function ask(msg,yes,no){const d=$('#dlg');d.oninput=null;d.onkeydown=null;d.innerHTML='<h3>'+esc(msg)+'</h3><div class="row"><button class="g" id="cx">Cancel</button><button id="ok">Yes</button></div>';d.showModal();$('#cx').onclick=()=>{d.close();if(no)no()};$('#ok').onclick=()=>{d.close();yes()}}
function sync(){
  const inv=new Set(S.invoices.flatMap(i=>i.p||[]));
  S.projects.forEach(p=>{if(['Received','N/A','Invoice sent'].includes(p.payment))p.invoiced=true;else if(!inv.has(p.id))p.invoiced=false});
  S.invoices.forEach(i=>{if(!(i.p||[]).length)return;const all=i.p.every(id=>{const p=S.projects.find(x=>x.id==id);return !p||p.payment=='Received'});if(all&&!i.paid){i.paid=true;i.paidOn=i.paidOn||today()}if(!all&&i.paid){i.paid=false;i.paidOn=null}});
}
function save(){
  sync();S.meta.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));if(!fuser)sv('✓ Saved on this device')}catch(e){mem=true;sv('⚠ Not saved — your browser is blocking storage',1)}
  cloudPush();render()}
function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button id="un">Undo</button>':'');t.style.display='flex';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',6000);if(undo)$('#un').onclick=()=>{undo();t.style.display='none'}}
function exp(){S.meta.lastBackup=today();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='studio-tracker-backup-'+today()+'.json';a.click();save();toast('Backup downloaded — keep it somewhere safe')}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.clients||!d.projects)throw 0;d.entries=d.entries||[];d.invoices=d.invoices||[];S=d;S.meta=S.meta||{};save();toast('Backup restored')}catch(e){toast('That file doesn\'t look like a Studio Tracker backup.')}el.value=''};r.readAsText(f)}
function bill(cid){return[...S.projects.filter(p=>p.client==cid&&p.status=='Completed'&&!p.invoiced&&p.amount>0).map(p=>({id:p.id,k:'p',date:p.date,amt:+p.amount})),
 ...S.entries.filter(e=>e.client==cid&&!e.invoiced&&!((S.clients.find(c=>c.id==cid)||{}).retainer)).map(e=>({id:e.id,k:'e',date:e.date,amt:e.qty*e.rate}))]}
function due(c){const b=bill(c.id);if(!b.length)return null;if(c.cycle=='project')return b.some(x=>x.k=='p')?today():null;
 const d=new Date(b.map(x=>x.date).sort()[0]+'T00:00');return ymd(new Date(d.getFullYear(),d.getMonth()+(c.cycle=='bimonthly'?2:1),0))}
function form(title,fields,onSave,pv){
  const d=$('#dlg');
  d.innerHTML=`<h3>${title}</h3>`+fields.map(f=>`<label>${f.l}`+(f.o?`<select name="${f.k}">${opts(f.o,f.v)}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any" min="0"':''} value="${esc(f.v)}" ${f.h?`placeholder="${esc(f.h)}"`:''}>`)+`</label>`).join('')+(pv?'<div id="pv" style="font-weight:700"></div>':'')+`<div class="row"><button class="g" id="cx">Cancel</button><button id="ok">Save</button></div>`;
  const get=()=>{const v={};fields.forEach(f=>{const e=d.querySelector(`[name=${f.k}]`);v[f.k]=f.t=='number'?(+e.value||0):e.value.trim()});return v};
  const upd=()=>{if(pv)$('#pv').textContent=pv(get())};upd();d.oninput=upd;
  d.onkeydown=e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'){e.preventDefault();$('#ok').click()}};
  d.showModal();$('#cx').onclick=()=>d.close();
  $('#ok').onclick=()=>{const v=get();if(fields[0].req&&!v[fields[0].k]&&!v.name&&!v.desc){return}d.close();onSave(v)};
  const first=d.querySelector('input,select');if(first)first.focus();
}
function editClient(id){
  const c=S.clients.find(x=>x.id==id)||{};
  form(id?'Edit client':'New client',[{k:'name',l:'Client name *',v:c.name,req:1},{k:'contact',l:'Contact person',v:c.contact},{k:'cycle',l:'When should I remind you to invoice?',v:c.cycle||'monthly',o:Object.entries(CYC)},{k:'rate',l:'Usual rate per unit (₹) — used for work entries',t:'number',v:c.rate||''},{k:'retainer',l:'How do you bill this client?',v:c.retainer?'yes':'no',o:[['no','Per unit — qty × rate'],['yes','Monthly retainer — entries are deliverables linked to a retainer']]}],v=>{
    if(!v.name)return toast('Please enter a client name');v.retainer=v.retainer=='yes';if(id)Object.assign(c,v);else{c.id=uid();Object.assign(c,v);S.clients.push(c);cur=c.id;view='client'}save();toast('Client saved')});
}
function editProject(id){
  if(!S.clients.length)return toast('Add a client first (Clients tab).');
  const p=S.projects.find(x=>x.id==id)||{};
  form(id?'Edit project':'New project',[{k:'name',l:'Project / deliverable *',v:p.name,req:1},{k:'client',l:'Client',v:p.client||cur||S.clients[0].id,o:S.clients.map(c=>[c.id,c.name])},{k:'date',l:'Start date',t:'date',v:p.date||today()},{k:'amount',l:'Amount (₹) — leave 0 if not decided yet',t:'number',v:p.amount||''},{k:'duration',l:'Timeline (e.g. 2 weeks)',v:p.duration},{k:'status',l:'Status',v:p.status||'In progress',o:ST},{k:'payment',l:'Payment',v:p.payment||'Pending',o:PAY}],v=>{
    if(!v.name)return toast('Please enter a project name');if(id)Object.assign(p,v);else{p.id=uid();p.invoiced=false;Object.assign(p,v);S.projects.push(p)}save();toast('Project saved')});
}
function editEntry(id,cid){
  const e=S.entries.find(x=>x.id==id)||{};cid=e.client||cid||cur;const c=S.clients.find(x=>x.id==cid);if(!c)return;
  const prs=S.projects.filter(p=>p.client==cid).sort((a,b)=>a.date<b.date?1:-1);
  if(c.retainer)return form((id?'Edit deliverable':'New deliverable')+' — '+esc(c.name),[{k:'desc',l:'Deliverable *',v:e.desc,req:1,h:'e.g. Product shot – Tennis Bracelet'},{k:'proj',l:'Counts towards which retainer?',v:e.proj||(prs[0]||{}).id||'',o:[['','— not linked yet —'],...prs.map(p=>[p.id,ml(p.date.slice(0,7))+' · '+p.name+' · '+inr(p.amount)])]},{k:'qty',l:'How many (variations / items)',t:'number',v:e.qty??1}],v=>{
    const p=S.projects.find(x=>x.id==v.proj),o={desc:v.desc,qty:v.qty||1,rate:0,proj:v.proj,date:e.date&&e.proj==v.proj?e.date:(p?p.date:today())};
    if(id)Object.assign(e,o);else S.entries.push({id:uid(),client:cid,invoiced:true,...o});save();toast('Deliverable saved')});
  form(id?'Edit work entry':'New work entry — '+esc(c.name),[{k:'desc',l:'Work done *',v:e.desc,req:1,h:'e.g. Card sheet set – front & back'},{k:'date',l:'Date',t:'date',v:e.date||today()},{k:'qty',l:'Quantity (sheets / units)',t:'number',v:e.qty??1},{k:'rate',l:'Rate per unit (₹)',t:'number',v:e.rate??c.rate??0}],v=>{
    if(id)Object.assign(e,v);else S.entries.push({id:uid(),client:cid,invoiced:false,...v});save();toast('Entry saved')},v=>'Amount: '+inr(v.qty*v.rate));
}
function del(list,id,what){const snap=JSON.stringify(S);ask('Delete this '+what+'?',()=>{S[list]=S[list].filter(x=>x.id!=id);save();toast(what[0].toUpperCase()+what.slice(1)+' deleted',()=>{S=JSON.parse(snap);save()})})}
function delClient(id){const snap=JSON.stringify(S);ask('Delete this client and ALL their projects, entries and invoices?',()=>{S.clients=S.clients.filter(x=>x.id!=id);['projects','entries','invoices'].forEach(l=>S[l]=S[l].filter(x=>x.client!=id));go('cli');toast('Client deleted',()=>{S=JSON.parse(snap);save()})})}
function setF(list,id,k,v){S[list].find(x=>x.id==id)[k]=v;save()}
function invoice(cid){
  const b=bill(cid);if(!b.length)return;const sub=b.reduce((a,x)=>a+x.amt,0),disc=+($('#disc')||{}).value||0,rush=+($('#rush')||{}).value||0;
  S.invoices.push({id:uid(),client:cid,date:today(),sub,disc,rush,total:sub-disc+rush,paid:false,p:b.filter(x=>x.k=='p').map(x=>x.id),e:b.filter(x=>x.k=='e').map(x=>x.id)});
  b.forEach(x=>{const i=(x.k=='p'?S.projects:S.entries).find(i=>i.id==x.id);i.invoiced=true;if(x.k=='p'&&i.payment=='Pending')i.payment='Invoice sent'});save();toast('Marked as invoiced — it now shows under "Awaiting payment"');
}
function pay(id,v){const i=S.invoices.find(x=>x.id==id);i.paid=v;i.paidOn=v?today():null;(i.p||[]).forEach(pid=>{const p=S.projects.find(x=>x.id==pid);if(p)p.payment=v?'Received':'Invoice sent'});save()}
function cancelInv(id){const snap=JSON.stringify(S);ask('Cancel this invoice? Its work goes back to "unbilled".',()=>{const i=S.invoices.find(x=>x.id==id);(i.p||[]).forEach(x=>{const p=S.projects.find(y=>y.id==x);if(p){p.invoiced=false;if(p.payment=='Invoice sent')p.payment='Pending'}});(i.e||[]).forEach(x=>{const e=S.entries.find(y=>y.id==x);if(e)e.invoiced=false});S.invoices=S.invoices.filter(x=>x.id!=id);save();toast('Invoice cancelled',()=>{S=JSON.parse(snap);save()})})}
const slug=s=>String(s||'').replace(/[^a-zA-Z]/g,'');
const pP=v=>`<span class="pill pp-${slug(v)}">${esc(v)}</span>`,pS=v=>`<span class="pill ps-${slug(v)}">${esc(v)}</span>`;
const emon=e=>{const p=S.projects.find(x=>x.id==e.proj);return(p?p.date:e.date).slice(0,7)};
const clk=id=>`<a class="lk" href="#client/${id}">${esc(cn(id))}</a>`;
let cq='';
function calcNet(t){$('#net').textContent=inr(t-(+$('#disc').value||0)+(+$('#rush').value||0))}
function editInv(id){const i=S.invoices.find(x=>x.id==id);form('Edit invoice — '+esc(cn(i.client)),[{k:'disc',l:'Discount (₹, subtracted)',t:'number',v:i.disc||0},{k:'rush',l:'Rush fee (₹, added)',t:'number',v:i.rush||0}],v=>{i.disc=v.disc;i.rush=v.rush;i.total=i.sub-v.disc+v.rush;save();toast('Invoice updated')},v=>'Invoice total: '+inr(i.sub-v.disc+v.rush)+'  (work '+inr(i.sub)+')')}
function go(v,c){const h=v=='client'?'client/'+c:v;if(location.hash=='#'+h)route();else location.hash=h}
function route(){const h=(location.hash||'#dash').slice(1).split('/'),nv=['dash','proj','cli','client'].includes(h[0])?h[0]:'dash';if(nv!=view||(h[1]||null)!=cur){mf='all';bf='all'}view=nv;cur=h[1]||null;render();scrollTo(0,0)}
addEventListener('hashchange',route);
function showP(f,s){pf={m:'all',c:'all',s:s||'All',q:'',f:f};go('proj')}
function clearF(){pf={m:'all',c:'all',s:'All',q:'',f:'all'};render()}
function jump(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function setLink(id,pid){const e=S.entries.find(x=>x.id==id),p=S.projects.find(x=>x.id==pid);e.proj=pid;if(p)e.date=p.date;save()}
function nw(k){$('#newm').open=false;if(k=='project')editProject();else if(k=='client')editClient();else if(view=='client'&&cur)editEntry();else if(!S.clients.length)toast('Add a client first.');else form('Add work entry for…',[{k:'client',l:'Which client?',v:S.clients[0].id,o:S.clients.map(c=>[c.id,c.name])}],v=>editEntry(null,v.client))}
function render(){
  const lim=ymd(new Date(Date.now()+7*864e5)),n=S.clients.filter(c=>{const d=due(c);return d&&d<=lim}).length;
  $('#nav').innerHTML=[['dash','🏠 Dashboard',n?`<span class="cnt hot" title="Invoices due within a week">${n}</span>`:''],['proj','📁 Projects',`<span class="cnt">${S.projects.length}</span>`],['cli','👥 Clients',`<span class="cnt">${S.clients.length}</span>`]].map(([k,l,c])=>`<button class="${view==k||(k=='cli'&&view=='client')?'on':''}" onclick="go('${k}')">${l} ${c}</button>`).join('');
  $('#app').innerHTML=(FB_CONFIG&&!fuser?'<div class="banner">☁ <span>Sign in to sync your data across all your devices.</span><button onclick="signIn()">Sign in with Google</button></div>':'')+(mem?'<div class="banner">⚠ Your browser is blocking saving, so changes will be lost when you close this page. Use ⬇ Backup often.</div>':'')+(view=='dash'?dash():view=='proj'?proj():view=='cli'?clients():client());
  document.title=(n?`(${n}) `:'')+'Studio Tracker';
}
function dash(){
  const unb=S.clients.reduce((a,c)=>a+bill(c.id).reduce((s,x)=>s+x.amt,0),0),out=S.invoices.filter(i=>!i.paid),td=today(),orp=S.projects.filter(p=>p.payment=='Invoice sent'&&p.amount>0&&!out.some(i=>(i.p||[]).includes(p.id)));
  const rem=S.clients.map(c=>({c,d:due(c),t:bill(c.id).reduce((s,x)=>s+x.amt,0)})).filter(r=>r.d).sort((a,b)=>a.d<b.d?-1:1);
  const stale=S.clients.length>0&&!fuser&&(!S.meta.lastBackup||(Date.now()-new Date(S.meta.lastBackup))/864e5>14);
  const card=(l,v,act,sub)=>`<div class="card stat ck" onclick="${act}"><span class="mut">${l}</span><b>${v}</b><span class="mut">${sub}</span></div>`;
  return(!S.clients.length?'<div class="card" style="margin-bottom:12px"><b>👋 Welcome!</b><p class="mut" style="margin:6px 0 0">Starting fresh? Add your first client with <b>＋ New</b>. Already have a backup file? Use <b>⬆ Restore</b> (top right) to load it.</p></div>':'')+(stale?`<div class="banner">💾 <span>${S.meta.lastBackup?'Last backup was over 2 weeks ago.':'You haven\'t backed up yet.'} Your data lives in this browser only.</span><button onclick="exp()">Back up now</button></div>`:'')+
`<div class="grid">${card('Work ready to invoice',inr(unb),"jump('rem')",'see who to invoice ↓')}${card('Invoiced, awaiting payment',inr(out.reduce((a,i)=>a+i.total,0)+orp.reduce((a,p)=>a+p.amount,0)),"showP('awaiting')",`${out.length+orp.length} invoice${out.length+orp.length==1?'':'s'} · view projects →`)}${card('Projects in progress',S.projects.filter(p=>p.status=='In progress').length,"showP('all','In progress')",'view projects →')}</div>
<h2 id="rem">🔔 Time to invoice <span class="cnt">${rem.length}</span></h2>`+(rem.length?rem.map(r=>{const days=Math.round((new Date(r.d+'T00:00')-new Date(td+'T00:00'))/864e5),cl=days<0?'over':days<=7?'soon':'later';
    const msg=days<0?`Overdue by ${-days} day${days==-1?'':'s'}`:days==0?'Invoice today':`Invoice by ${fd(r.d)} · in ${days} days`;
    return`<div class="card rem ${cl}"><div>${clk(r.c.id)} <span class="tag">${CYC[r.c.cycle]}</span><div class="mut">${msg}</div></div><div><b>${inr(r.t)}</b> <button onclick="go('client','${r.c.id}')">Review &amp; invoice</button></div></div>`}).join(''):`<div class="card empty">Nothing to invoice right now 🎉</div>`)+
  `<h2>⏳ Awaiting payment <span class="cnt">${out.length+orp.length}</span></h2>`+(out.length+orp.length?orp.map(p=>`<div class="card rem"><div>${clk(p.client)}<div class="mut">${esc(p.name)} · invoice sent</div></div><div><b>${inr(p.amount)}</b> <button onclick="setF('projects','${p.id}','payment','Received')">Mark paid</button></div></div>`).join('')+out.map(i=>`<div class="card rem"><div>${clk(i.client)}<div class="mut">Invoiced ${fd(i.date)}${i.disc?` · −${inr(i.disc)} discount`:''}${i.rush?` · +${inr(i.rush)} rush fee`:''}</div></div><div><b>${inr(i.total)}</b> <button onclick="pay('${i.id}',true)">Mark paid</button></div></div>`).join(''):`<div class="card empty">No unpaid invoices</div>`)+
  `<details><summary>How this works</summary><p class="mut"><b>Dashboard</b> shows what needs action. <b>Projects</b> lists every job — use the quick views and filters. <b>Clients</b> opens a client's page: billing, work entries, projects and invoices. Use <b>＋ New</b> (top right) to add things from anywhere. Everything is saved in this browser — use ⬇ Backup now and then.</p></details>`;
}
function ptab(){
  const l=S.projects.filter(p=>pm[pf.f](p)&&(pf.m=='all'||p.date.slice(0,7)==pf.m)&&(pf.c=='all'||p.client==pf.c)&&(pf.s=='All'||p.status==pf.s)&&(!pf.q||(p.name+cn(p.client)).toLowerCase().includes(pf.q.toLowerCase()))).sort((a,b)=>a.date<b.date?1:-1);
  const sel=(p,k,o,pre)=>`<select class="pill ${pre}-${slug(p[k])}" onchange="setF('projects','${p.id}','${k}',this.value)">${opts(o,p[k])}</select>`;
  return`<div class="mut" style="margin:6px 0">${l.length} project${l.length==1?'':'s'} · total ${inr(l.reduce((a,p)=>a+(+p.amount||0),0))}</div><div class="card wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Project</th><th class="n">Amount</th><th>Status</th><th>Payment</th><th></th></tr></thead><tbody>`+
  l.map(p=>`<tr><td>${fd(p.date)}</td><td>${clk(p.client)}</td><td style="white-space:normal;min-width:180px">${esc(p.name)}</td><td class="n">${inr(p.amount)}</td><td>${sel(p,'status',ST,'ps')}</td><td>${sel(p,'payment',PAY,'pp')}</td><td><button class="t" onclick="editProject('${p.id}')">✏️ Edit</button><button class="t d" onclick="del('projects','${p.id}','project')">🗑</button></td></tr>`).join('')+`</tbody></table>${l.length?'':'<div class="empty">No projects match these filters.</div>'}</div>`;
}
function proj(){
  return`<div class="lab">Quick views</div><div class="bar">${PF.map(([k,l])=>`<button class="${pf.f==k?'':'g'}" onclick="pf.f='${k}';render()">${l} <span class="tag">${S.projects.filter(pm[k]).length}</span></button>`).join('')}</div>
<div class="lab">Refine</div><div class="bar"><input type="search" placeholder="Search projects…" value="${esc(pf.q)}" oninput="pf.q=this.value;$('#ptab').innerHTML=ptab()">
<select onchange="pf.m=this.value;render()">${mopts(S.projects.map(p=>p.date),pf.m)}</select>
<select onchange="pf.c=this.value;render()"><option value="all">All clients</option>${opts(S.clients.map(c=>[c.id,c.name]),pf.c)}</select>
<select onchange="pf.s=this.value;render()">${opts(['All',...ST],pf.s)}</select><button class="g" onclick="clearF()">✕ Clear filters</button><span class="sp"></span><button onclick="editProject()">＋ New project</button></div>
<div class="legend mut"><b>Payment:</b> ${['Pending','Invoice sent','Received','N/A'].map(pP).join(' ')} &nbsp; <b>Project:</b> ${ST.map(pS).join(' ')}</div><div id="ptab">${ptab()}</div>`;
}
function ctab(){
  const q=cq.toLowerCase(),l=S.clients.filter(c=>!q||(c.name+(c.contact||'')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  return`<div class="grid">`+l.map(c=>{const t=bill(c.id).reduce((a,x)=>a+x.amt,0),d=due(c);
    return`<div class="card ck" onclick="go('client','${c.id}')"><b>${esc(c.name)}</b>${d&&d<today()?' <span class="pill pp-Pending">Invoice overdue</span>':''}<div class="mut">${esc(c.contact)||'&nbsp;'}</div><div style="margin-top:8px"><span class="tag">${CYC[c.cycle]}</span>${c.retainer?' <span class="tag">Retainer</span>':''}</div><div style="margin-top:8px">Ready to invoice <b>${inr(t)}</b></div></div>`}).join('')+`</div>${l.length?'':'<div class="card empty">No clients found.</div>'}`;
}
function clients(){return`<div class="bar"><input type="search" placeholder="Search clients…" value="${esc(cq)}" oninput="cq=this.value;$('#ctab').innerHTML=ctab()"><span class="sp"></span><button onclick="editClient()">＋ New client</button></div><div id="ctab">${ctab()}</div>`}
function client(){
  const c=S.clients.find(x=>x.id==cur);if(!c)return`<div class="card empty">That client no longer exists. <a class="lk" href="#cli">Back to clients</a></div>`;
  const R=!!c.retainer,all=S.entries.filter(e=>e.client==c.id),prs=S.projects.filter(p=>p.client==c.id).sort((a,b)=>a.date<b.date?1:-1),ok=pid=>prs.some(p=>p.id==pid);
  const l=all.filter(e=>(mf=='all'||emon(e)==mf)&&(R?(bf!='unl'||!ok(e.proj)):(bf=='all'||(bf=='un')==!e.invoiced))).sort((a,b)=>a.date<b.date?1:-1);
  const t=bill(c.id).reduce((a,x)=>a+x.amt,0),d=due(c),unl=R?all.filter(e=>!ok(e.proj)).length:0;
  const rsel=e=>`<select onchange="setLink('${e.id}',this.value)"><option value="">— not linked —</option>${prs.map(p=>`<option value="${p.id}" ${p.id==e.proj?'selected':''}>${ml(p.date.slice(0,7))} · ${esc(p.name)} · ${inr(p.amount)}</option>`).join('')}</select>`;
  const act=e=>`<td><button class="t" onclick="editEntry('${e.id}')">✏️ Edit</button><button class="t d" onclick="del('entries','${e.id}','entry')">🗑</button></td>`;
  const linked=[...new Set(l.filter(e=>ok(e.proj)).map(e=>e.proj))].reduce((a,id)=>a+(+prs.find(p=>p.id==id).amount||0),0);
  const invTag=e=>{const i=S.invoices.find(x=>(x.e||[]).includes(e.id));return i?`<span class="mut">${fd(i.date)} · ${inr(i.total)}</span> ${pP(i.paid?'Received':'Invoice sent')}`:''},rpay=e=>{const p=prs.find(x=>x.id==e.proj);return p?pP(p.payment):''};
  return`<div class="mut crumb"><a class="lk" href="#cli">Clients</a> › <b>${esc(c.name)}</b></div>
<div class="bar"><h2 style="margin:0 6px 0 0">${esc(c.name)}</h2><span class="mut">${esc(c.contact)}</span>${R?' <span class="tag">Retainer client</span>':''}<span class="sp"></span><button class="g" onclick="editClient('${c.id}')">✏️ Edit client</button><button class="g d" onclick="delClient('${c.id}')">🗑 Delete</button></div>
<div class="jump"><span class="mut">Jump to:</span><button class="g" onclick="jump('s-bill')">Invoice</button><button class="g" onclick="jump('s-ent')">${R?'Deliverables':'Work entries'}</button><button class="g" onclick="jump('s-proj')">Projects</button><button class="g" onclick="jump('s-inv')">Invoices</button></div>
<div class="card" id="s-bill"><div class="bar" style="align-items:flex-end"><div><span class="mut">Ready to invoice</span><br><b style="font-size:24px">${inr(t)}</b></div><span class="sp"></span>
<label style="margin:0">Remind me<br><select onchange="setF('clients','${c.id}','cycle',this.value)">${opts(Object.entries(CYC),c.cycle)}</select></label>
<label style="margin:0">Discount (₹, subtracted)<br><input id="disc" type="number" min="0" value="0" style="width:110px" oninput="calcNet(${t})"></label>
<label style="margin:0">Rush fee (₹, added)<br><input id="rush" type="number" min="0" value="0" style="width:110px" oninput="calcNet(${t})"></label>
<div><span class="mut">Invoice total</span><br><b id="net" style="font-size:18px">${inr(t)}</b></div><button onclick="invoice('${c.id}')" ${t?'':'disabled'}>Mark invoiced</button></div>
<div class="mut">${d?'Invoice reminder: '+fd(d):c.cycle=='project'&&t?'Reminder starts once a project is marked Completed':'Nothing waiting to be invoiced'}</div></div>
<h2 id="s-ent">${R?'Deliverables':'Work entries'}</h2>${R?`<p class="mut" style="margin:0 0 6px">Deliverables are covered by that month's retainer, so they carry no price of their own.</p>`:''}${unl?`<div class="banner">⚠ <span>${unl} deliverable${unl==1?' isn\'t':'s aren\'t'} linked to a retainer yet.</span><button onclick="bf='unl';render()">Show them</button></div>`:''}
<div class="bar"><button onclick="editEntry()">＋ Add ${R?'deliverable':'entry'}</button>
<select onchange="mf=this.value;render()">${mopts(all.map(e=>emon(e)+'-01'),mf)}</select>
<select onchange="bf=this.value;render()">${opts(R?[['all','All deliverables'],['unl','Not linked to a retainer']]:[['all','All entries'],['un','Not invoiced yet'],['bi','Already invoiced']],bf)}</select></div>
<div class="card wrap"><table><thead><tr>`+(R?`<th>Month</th><th>Deliverable</th><th class="n">Qty</th><th>Retainer</th><th>Payment</th><th></th>`:`<th>Date</th><th>Work</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th><th>Invoiced</th><th>Invoice</th><th></th>`)+`</tr></thead><tbody>`+
  l.map(e=>R?`<tr><td>${ml(emon(e))}</td><td style="white-space:normal;min-width:200px">${esc(e.desc)}</td><td class="n">${e.qty}</td><td>${rsel(e)}</td><td>${rpay(e)}</td>${act(e)}</tr>`:`<tr><td>${fd(e.date)}</td><td style="white-space:normal;min-width:200px">${esc(e.desc)}</td><td class="n">${e.qty}</td><td class="n">${inr(e.rate)}</td><td class="n">${inr(e.qty*e.rate)}</td><td><input type="checkbox" ${e.invoiced?'checked':''} onchange="setF('entries','${e.id}','invoiced',this.checked)" title="Tick when invoiced"></td><td>${invTag(e)}</td>${act(e)}</tr>`).join('')+
  `</tbody>${l.length?`<tfoot><tr>${R?`<td colspan="2">Total for this view: ${l.length} deliverable${l.length==1?'':'s'}</td><td class="n">${l.reduce((a,e)=>a+e.qty,0)}</td><td colspan="3">Retainer value: ${inr(linked)}</td>`:`<td colspan="4">Total for this view (${l.length})</td><td class="n">${inr(l.reduce((a,e)=>a+e.qty*e.rate,0))}</td><td colspan="3"></td>`}</tr></tfoot>`:''}</table>${l.length?'':'<div class="empty">Nothing here yet.</div>'}</div>
<h2 id="s-proj">Projects</h2><div class="bar"><button class="g" onclick="editProject()">＋ New project</button></div>`+(prs.length?`<div class="card wrap"><table><tbody>`+prs.map(p=>`<tr><td>${fd(p.date)}</td><td style="white-space:normal">${esc(p.name)}${R?` <span class="mut">· ${all.filter(e=>e.proj==p.id).length} deliverables</span>`:''}</td><td class="n">${inr(p.amount)}</td><td>${pS(p.status)}</td><td>${pP(p.payment)}</td><td><button class="t" onclick="editProject('${p.id}')">✏️</button><button class="t d" onclick="del('projects','${p.id}','project')">🗑</button></td></tr>`).join('')+`</tbody></table></div>`:'<div class="card empty">No projects for this client.</div>')+
  `<h2 id="s-inv">Invoices</h2>`+(S.invoices.filter(i=>i.client==c.id).sort((a,b)=>a.date<b.date?1:-1).map(i=>`<div class="card rem"><div>${fd(i.date)} ${i.paid?pP('Received')+' '+fd(i.paidOn):pP('Invoice sent')}${i.disc||i.rush?`<div class="mut">${inr(i.sub)}${i.disc?` − ${inr(i.disc)} discount`:''}${i.rush?` + ${inr(i.rush)} rush fee`:''}</div>`:''}</div><div><b>${inr(i.total)}</b> <button class="g" onclick="pay('${i.id}',${!i.paid})">${i.paid?'Mark unpaid':'Mark paid'}</button><button class="t" onclick="editInv('${i.id}')">✏️ Edit</button><button class="t d" onclick="cancelInv('${i.id}')">Cancel</button></div></div>`).join('')||'<div class="card empty">No invoices yet.</div>');
}

const FB_CONFIG={ apiKey: "AIzaSyBPiEQRAUB-Kbyn8azzE09MyoQATOJMGGI", authDomain: "hs-freelance-tracker.firebaseapp.com", projectId: "hs-freelance-tracker", storageBucket: "hs-freelance-tracker.firebasestorage.app", messagingSenderId: "920867457044", appId: "1:920867457044:web:7763401b97b69f4dbdff01" };
let fdb=null,fuser=null,fq=Promise.resolve(),unsub=null,firstAttach=true;
function acct(){const e=$('#acct');if(!e)return;e.innerHTML=!FB_CONFIG?'':fuser?`<span class="mut">${esc(fuser.email||'')}</span> <button class="g" onclick="signOut()">Sign out</button>`:`<button onclick="signIn()">Sign in</button>`}
function cloudInit(){
  if(!FB_CONFIG)return;
  if(!window.firebase){sv('⚠ Couldn\'t load sync — working on this device only',1);return}
  try{firebase.initializeApp(FB_CONFIG);fdb=firebase.firestore();
    firebase.auth().onAuthStateChanged(u=>{fuser=u;acct();if(u)cloudAttach();else{if(unsub)unsub();unsub=null;firstAttach=true;sv('Not signed in — saved on this device');render()}})}
  catch(e){sv('⚠ Sync setup problem ('+(e.code||e.message)+')',1)}
  acct();
}
function signIn(){const a=firebase.auth(),p=new firebase.auth.GoogleAuthProvider();a.signInWithPopup(p).catch(e=>{if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment')a.signInWithRedirect(p);else if(e.code!='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.code||e.message))})}
function signOut(){firebase.auth().signOut()}
const dref=()=>fdb.collection('users').doc(fuser.uid).collection('tracker').doc('data');
function adopt(d){S=Object.assign({clients:[],projects:[],entries:[],invoices:[],meta:{}},d);S.meta=S.meta||{};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();sv('✓ Synced')}
function cloudAttach(){
  if(unsub)unsub();sv('Syncing…');
  unsub=dref().onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const has=S.clients.length||S.projects.length||S.entries.length;
    if(!snap.exists){if(has)cloudPush();else sv('✓ Synced');firstAttach=false;return}
    const d=snap.data(),cu=(d.meta||{}).updatedAt||0,lu=(S.meta||{}).updatedAt||0;
    if(cu>lu||!has){adopt(d)}
    else if(lu>cu){
      if(firstAttach)ask('This device has newer changes than your cloud copy. Upload them and replace the cloud copy? (No = load the cloud copy instead.)',()=>cloudPush(),()=>adopt(d));
      else cloudPush()}
    else sv('✓ Synced');
    firstAttach=false;
  },e=>sv('⚠ Sync error ('+(e.code||e.message)+')',1));
}
function cloudPush(){
  if(!fdb||!fuser)return;sv('Syncing…');const snap=JSON.parse(JSON.stringify(S));
  fq=fq.then(()=>dref().set(snap)).then(()=>sv('✓ Synced')).catch(e=>sv('⚠ Not synced ('+(e.code||e.message)+')',1));
}

function boot(){
  S.meta=S.meta||{};['clients','projects','entries','invoices'].forEach(k=>S[k]=S[k]||[]);sync();cloudInit();
  sv(mem?'⚠ Not saved — your browser is blocking storage':'✓ Saved on this device',mem);route();
}
boot();
