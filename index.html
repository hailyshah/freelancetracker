<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Tracker</title>
<style>
:root{--bg:#faf8f3;--card:#ffffff;--ink:#1c2333;--mut:#6f7380;--line:#e6e2d8;--acc:#1d2f5d;--ok:#2e8b57;--warn:#d98e04;--bad:#c0392b}


*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
main,header{max-width:1020px;margin:0 auto;padding:12px 16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:24px 0 8px}h3{margin:0 0 12px}
.top,.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}.bar{justify-content:flex-start;margin:8px 0}
nav{display:flex;gap:6px;margin-top:10px}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:default}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button .tag{color:var(--ink)}button.t{background:transparent;color:var(--mut);padding:4px 7px}
button.t:hover{color:var(--ink)}button.d:hover{color:var(--bad)}
nav button{background:transparent;color:var(--mut);border:1px solid var(--line)}nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
select,input{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px}.mut{color:var(--mut);font-size:13px}.sp{flex:1}
.rem{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;border-left:4px solid var(--line)}
.rem.over{border-left-color:var(--bad)}.rem.soon{border-left-color:var(--warn)}.rem.later{border-left-color:var(--ok)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.ok{background:#2e8b5722;color:var(--ok)}.tag.w{background:#d98e0426;color:var(--warn)}
.wrap{overflow-x:auto;padding:4px 8px}table{border-collapse:collapse;width:100%;min-width:660px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut)}
tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}tfoot td{font-weight:700}
.empty{text-align:center;color:var(--mut);padding:22px}.ck{cursor:pointer}.ck:hover{border-color:var(--acc)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(430px,92vw)}
dialog::backdrop{background:#0006}label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
dialog input,dialog select{display:block;width:100%;margin-top:3px;color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:9}
#toast button{background:transparent;color:var(--acc);padding:0;font-weight:700}
.banner{background:#d98e0422;border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details{margin:12px 0}summary{cursor:pointer;color:var(--mut)}
header{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);max-width:none;padding:10px 16px}header>*{max-width:988px;margin-left:auto;margin-right:auto}
.cnt{font-size:11px;background:var(--line);color:var(--ink);border-radius:99px;padding:1px 7px;margin-left:3px}.cnt.hot{background:var(--bad);color:#fff}
nav button.on .cnt{background:#fff3;color:inherit}
.menu{position:relative}.menu summary{list-style:none;background:var(--acc);color:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;color:#fff}.menu summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:150px;z-index:8}.menu>div button{text-align:left}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 -2px}.legend{margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lk{color:var(--acc);text-decoration:none;font-weight:600}.lk:hover{text-decoration:underline}.crumb{margin-bottom:6px}
.jump{position:sticky;top:96px;z-index:4;background:var(--bg);padding:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.jump button{padding:4px 10px}
h2[id],.card[id]{scroll-margin-top:150px}.stat.ck{cursor:pointer}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
select.pill{padding:4px 8px;cursor:pointer}option{background:var(--card);color:var(--ink)}
.pp-Pending{background:#fde2e2;color:#b42318}.pp-Invoicesent{background:#fff1b8;color:#8a6100}.pp-Received{background:#d3f5df;color:#17713f}.pp-NA{background:#ececea;color:#6b655d}
.ps-Notstarted{background:#9b1c1c;color:#fff}.ps-Onhold{background:#c2410c;color:#fff}.ps-Inprogress{background:#a16207;color:#fff}.ps-Completed{background:#166534;color:#fff}
.mrow{padding:0;margin-bottom:8px}.mrow>summary{display:grid;grid-template-columns:90px 1fr 110px 90px 150px;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}.mrow>summary::-webkit-details-marker{display:none}.mrow>div,.mrow>.srow{margin:0 14px}.mrow[open]>summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.mbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--ok)}.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.mrow>div:last-child{padding-bottom:10px}
@media(max-width:620px){.mrow>summary{grid-template-columns:70px 1fr 90px}.mrow>summary>.mbar,.mrow>summary>.mut{grid-column:1/-1}}
.menu.g summary{background:transparent;color:var(--ink);border:1px solid var(--line)}.menu>div{align-items:stretch}#sv{font-size:12px}
.big{font-size:24px}.tabs{display:flex;gap:4px;margin:18px 0 10px;border-bottom:1px solid var(--line)}.tabs button{background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px}.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.rrow{display:grid;grid-template-columns:1fr 110px;gap:6px;margin-bottom:6px}.rrow input{margin:0}.over-t{color:var(--bad)}dialog{max-height:90vh;overflow:auto}.chips{margin-top:0}
.rrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rrow2 label{margin-bottom:8px}textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;margin-top:3px;resize:vertical}
#invwrap{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto}#invwrap[hidden]{display:none}
.inv-top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.inv-body{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;padding:16px;max-width:1240px;margin:0 auto}@media(max-width:860px){.inv-body{grid-template-columns:1fr}}
#sheetbox{width:100%;overflow:hidden}
#sheet{width:794px;height:1123px;box-sizing:border-box;background:#f5f5ef;color:#111;font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;padding:76px 79px 77px;display:flex;flex-direction:column;transform-origin:top left;box-shadow:0 1px 10px #0003;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#sheet .r{text-align:right}#sheet .c{text-align:center}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;height:69px}.sh-head img{height:69px;width:auto}.sh-biz{font-size:22px}
.sh-inv{font-family:'Bodoni Moda','Playfair Display',Didot,Georgia,serif;font-size:54px;line-height:1;letter-spacing:-.01em;font-weight:400;margin-top:2px}
.sh-meta{display:flex;justify-content:space-between;gap:20px;margin-top:56px}.sh-lab{font-weight:700;text-transform:uppercase;margin-bottom:2px}
.sh-t{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse}.sh-meta+.sh-t{margin-top:56px}
.sh-t th,.sh-t td{box-sizing:border-box;padding:14px 14px;font-size:14px;line-height:21px;white-space:normal;border-bottom:1px solid #111;text-align:left;height:49px;vertical-align:middle}.sh-t th{font-weight:700;border-top:1px solid #111}
.sh-t td.c,.sh-t th.c{text-align:center}.sh-s{margin-top:14px}.sh-s td{border:0;height:46px}.sh-s .lb{font-weight:700}.sh-s .gt td{height:56px;font-size:18px;font-weight:700}.sh-s .gt td:nth-child(3),.sh-s .gt td:nth-child(4){border-top:1px solid #111}
.sh-sp{flex:1}.sh-thx{font-size:26px;line-height:1.3;margin-bottom:36px}
.sh-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.sh-sig{font-family:'Bodoni Moda','Playfair Display',Didot,Georgia,serif;font-size:24px;line-height:1.2}.sh-st{font-size:14px}
@media print{body>*:not(#invwrap){display:none!important}#invwrap{position:static;overflow:visible;background:#f5f5ef}.inv-ui{display:none!important}.inv-body{display:block;padding:0;max-width:none}#sheetbox{height:auto!important;overflow:visible}#sheet{transform:none!important;box-shadow:none;margin:0}html,body{background:#f5f5ef!important}@page{size:A4;margin:0}}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<header><div class="top"><h1>Studio Tracker</h1><div class="bar" style="margin:0"><span id="sv" class="mut"></span>
<details id="newm" class="menu"><summary>+ New</summary><div><button class="g" onclick="nw('project')">Project</button><button class="g" onclick="nw('client')">Client</button><button class="g" onclick="nw('entry')">Work entry</button><button class="g" onclick="nw('invoice')">Invoice</button></div></details>
<details id="morem" class="menu g"><summary>More</summary><div><span id="acct"></span><button class="g" onclick="editSettings();$('#morem').open=false">Invoice settings</button><button class="g" onclick="exportCsv();$('#morem').open=false">Export CSV</button><button class="g" onclick="exp();$('#morem').open=false">Backup</button><button class="g" onclick="$('#imp').click();$('#morem').open=false">Restore</button></div></details>
<input type="file" id="imp" accept=".json" hidden onchange="imp(this)"></div></div><nav id="nav"></nav></header>
<main id="app"></main><div id="invwrap" hidden></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const ml=m=>new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
const mopts=(arr,sel)=>'<option value="all">All months</option>'+[...new Set(arr.map(d=>d.slice(0,7)))].sort().reverse().map(m=>`<option value="${m}" ${m==sel?'selected':''}>${ml(m)}</option>`).join('');
const opts=(a,sel)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`}).join('');
const KEY='studio-tracker-v1',SEED=null;
const CYC={monthly:'Monthly',bimonthly:'Every 2 months',project:'Project end'};
const PF=[['all','All'],['unpaid','Unpaid'],['awaiting','Invoice sent · awaiting payment'],['uninv','Done, not invoiced yet'],['hold','On hold'],['ns','Not started']];
const pm={all:p=>1,unpaid:p=>OPEN(p),awaiting:p=>p.invoiced&&OPEN(p),uninv:p=>p.status=='Completed'&&!p.invoiced&&p.payment=='Pending'&&p.amount>0,hold:p=>p.status=='On hold',ns:p=>p.status=='Not started'};
const OPEN=p=>(p.payment=='Pending'||p.payment=='Invoice sent')&&p.amount>0;
const ST=['Not started','In progress','On hold','Completed'],PAY=['Pending','Invoice sent','Received','N/A'];
let S=null,view='dash',cur=null,mf='all',bf='all',pf={m:'all',c:'all',s:'All',q:'',f:'all'},mem=false,tt;
S={clients:[],projects:[],entries:[],invoices:[],meta:{}};
try{const j=localStorage.getItem(KEY);if(j)S=Object.assign(S,JSON.parse(j))}catch(e){mem=true}
const cn=id=>(S.clients.find(c=>c.id==id)||{}).name||'—';
function sv(m,bad){const e=$('#sv');if(e){e.textContent=m;e.style.color=bad?'var(--bad)':'var(--mut)'}}
function ask(msg,yes,no){const d=$('#dlg');d.oninput=null;d.onkeydown=null;d.onchange=null;d.innerHTML='<h3>'+esc(msg)+'</h3><div class="row"><button class="g" id="cx">Cancel</button><button id="ok">Yes</button></div>';d.showModal();$('#cx').onclick=()=>{d.close();if(no)no()};$('#ok').onclick=()=>{d.close();yes()}}
function sync(){
  const inv=new Set(S.invoices.flatMap(i=>i.p||[]));
  S.projects.forEach(p=>{if(['Received','N/A','Invoice sent'].includes(p.payment))p.invoiced=true;else if(!inv.has(p.id))p.invoiced=false});
  S.invoices.forEach(i=>{if(!(i.p||[]).length)return;const all=i.p.every(id=>{const p=S.projects.find(x=>x.id==id);return !p||p.payment=='Received'});if(all&&!i.paid){i.paid=true;i.paidOn=i.paidOn||today()}if(!all&&i.paid){i.paid=false;i.paidOn=null}});
}
function save(){
  sync();S.meta.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));if(!fuser)sv('✓ Saved on this device')}catch(e){mem=true;sv('Not saved — your browser is blocking storage',1)}
  cloudPush();render()}
function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button id="un">Undo</button>':'');t.style.display='flex';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',6000);if(undo)$('#un').onclick=()=>{undo();t.style.display='none'}}
function exp(){S.meta.lastBackup=today();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='studio-tracker-backup-'+today()+'.json';a.click();save();toast('Backup downloaded — keep it somewhere safe')}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.clients||!d.projects)throw 0;d.entries=d.entries||[];d.invoices=d.invoices||[];S=d;S.meta=S.meta||{};fixS();save();toast('Backup restored')}catch(e){toast('That file doesn\'t look like a Studio Tracker backup.')}el.value=''};r.readAsText(f)}
function bill(cid){return[...S.projects.filter(p=>p.client==cid&&p.status=='Completed'&&!p.invoiced&&p.amount>0).map(p=>({id:p.id,k:'p',date:p.date,amt:+p.amount})),
 ...S.entries.filter(e=>e.client==cid&&!e.invoiced&&!((S.clients.find(c=>c.id==cid)||{}).retainer)).map(e=>({id:e.id,k:'e',date:e.date,amt:e.qty*e.rate}))]}
function due(c){const b=bill(c.id);if(!b.length)return null;if(c.cycle=='project')return b.some(x=>x.k=='p')?today():null;
 const d=new Date(b.map(x=>x.date).sort()[0]+'T00:00');return ymd(new Date(d.getFullYear(),d.getMonth()+(c.cycle=='bimonthly'?2:1),0))}
function form(title,fields,onSave,pv){
  const d=$('#dlg');d.onchange=null;
  d.innerHTML=`<h3>${title}</h3>`+fields.map(f=>`<label>${f.l}`+(f.o?`<select name="${f.k}">${opts(f.o,f.v)}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any" min="0"':''} value="${esc(f.v)}" ${f.h?`placeholder="${esc(f.h)}"`:''}>`)+`</label>`).join('')+(pv?'<div id="pv" style="font-weight:700"></div>':'')+`<div class="row"><button class="g" id="cx">Cancel</button><button id="ok">Save</button></div>`;
  const get=()=>{const v={};fields.forEach(f=>{const e=d.querySelector(`[name=${f.k}]`);v[f.k]=f.t=='number'?(+e.value||0):e.value.trim()});return v};
  const upd=()=>{if(pv)$('#pv').textContent=pv(get())};upd();d.oninput=upd;
  d.onkeydown=e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'){e.preventDefault();$('#ok').click()}};
  d.showModal();$('#cx').onclick=()=>d.close();
  $('#ok').onclick=()=>{const v=get();if(fields[0].req&&!v[fields[0].k]&&!v.name&&!v.desc){return}d.close();onSave(v)};
  const first=d.querySelector('input,select');if(first)first.focus();
}

function amtDef(){const c=cur&&S.clients.find(x=>x.id==cur);return c&&(c.billing=='fixed'||c.billing=='oneoff')&&c.amount||''}
function editProject(id){
  if(!S.clients.length)return toast('Add a client first (Clients tab).');
  const p=S.projects.find(x=>x.id==id)||{};
  form(id?'Edit project':'New project',[{k:'name',l:'Project / deliverable *',v:p.name,req:1},{k:'client',l:'Client',v:p.client||cur||S.clients[0].id,o:S.clients.map(c=>[c.id,c.name])},{k:'date',l:'Start date',t:'date',v:p.date||today()},{k:'amount',l:'Amount (₹) — leave 0 if not decided yet',t:'number',v:p.amount||(id?'':amtDef())},{k:'duration',l:'Timeline (e.g. 2 weeks)',v:p.duration},{k:'status',l:'Status',v:p.status||'In progress',o:ST},{k:'payment',l:'Payment',v:p.payment||'Pending',o:PAY},{k:'paidMonth',l:'Month payment received (if paid)',t:'month',v:p.paidMonth||''}],v=>{
    if(!v.name)return toast('Please enter a project name');if(v.payment!='Received')v.paidMonth='';else if(!v.paidMonth)v.paidMonth=today().slice(0,7);if(id)Object.assign(p,v);else{p.id=uid();p.invoiced=false;Object.assign(p,v);S.projects.push(p)}save();toast('Project saved')});
}
function editEntry(id,cid){
  const e=S.entries.find(x=>x.id==id)||{};cid=e.client||cid||cur;const c=S.clients.find(x=>x.id==cid);if(!c)return;
  const prs=S.projects.filter(p=>p.client==cid).sort((a,b)=>a.date<b.date?1:-1);
  if(c.retainer)return form((id?'Edit deliverable':'New deliverable')+' — '+esc(c.name),[{k:'desc',l:'Deliverable *',v:e.desc,req:1,h:'e.g. Product shot – Tennis Bracelet'},{k:'proj',l:'Counts towards which '+((c.billing=='oneoff'||c.billing=='multi')?'project':'retainer')+'?',v:e.proj||(prs[0]||{}).id||'',o:[['','— not linked yet —'],...prs.map(p=>[p.id,ml(p.date.slice(0,7))+' · '+p.name+' · '+inr(p.amount)])]},{k:'qty',l:'How many (variations / items)',t:'number',v:e.qty??1}],v=>{
    const p=S.projects.find(x=>x.id==v.proj),o={desc:v.desc,qty:v.qty||1,rate:0,proj:v.proj,date:e.date&&e.proj==v.proj?e.date:(p?p.date:today())};
    if(id)Object.assign(e,o);else S.entries.push({id:uid(),client:cid,invoiced:true,...o});save();toast('Deliverable saved')});
  form(id?'Edit work entry':'New work entry — '+esc(c.name),[{k:'desc',l:'Work done *',v:e.desc,req:1,h:'e.g. Card sheet set – front & back'},{k:'date',l:'Date',t:'date',v:e.date||today()},...(rcOf(c).length?[{k:'card',l:'Rate card item',v:'',o:[['','Custom'],...(c.rates||[]).map((r,i)=>[String(i),r.name+' · '+inr(r.amount)])]}]:[]),{k:'qty',l:'Quantity',t:'number',v:e.qty??1},{k:'rate',l:'Rate (₹)',t:'number',v:e.rate??(rcOf(c)[0]||{}).amount??c.rate??0}],v=>{
    delete v.card;if(id)Object.assign(e,v);else S.entries.push({id:uid(),client:cid,invoiced:false,...v});save();toast('Entry saved')},v=>'Amount: '+inr(v.qty*v.rate));
  $('#dlg').onchange=ev=>{if(ev.target.name=='card'&&ev.target.value!==''){const r=(c.rates||[])[+ev.target.value];if(r){$('#dlg [name=rate]').value=r.amount;$('#dlg').dispatchEvent(new Event('input'))}}};
}

  }
  const tb=(k,l,n)=>`<button class="${tab==k?'on':''}" onclick="ct='${k}';render()">${l} <span class="cnt">${n}</span></button>`;
  return`<div class="mut crumb"><a class="lk" href="#cli">Clients</a> / ${esc(c.name)}</div>
<div class="bar"><h2 style="margin:0 6px 0 0">${esc(c.name)}</h2>${c.billing?`<span class="tag">${BLs[c.billing]}</span>`:''}<span class="sp"></span><button class="g" onclick="editClient('${c.id}')">Edit client</button><button class="g d" onclick="delClient('${c.id}')">Delete</button></div>
<div class="mut">${esc(c.contact)}${c.contact&&price?' · ':''}${price}</div>${rcOf(c).length?`<div class="bar" style="margin:6px 0 0">${rcOf(c).map(r=>`<span class="tag">${esc(r.name)} ${inr(r.amount)}</span>`).join('')}</div>`:''}
<div class="card" id="s-bill" style="margin-top:12px"><div class="bar" style="align-items:flex-end"><div><span class="mut">Ready to invoice</span><br><b class="big">${inr(t)}</b><div class="mut">${d?'Invoice by '+fd(d):c.cycle=='project'&&t?'Invoice once a project is Completed':'Nothing to invoice'}</div></div><span class="sp"></span>
<button onclick="openInv('${c.id}')">Create invoice</button></div></div>
<div class="tabs">${tb('work',R?'Deliverables':'Work entries',all.length)}${tb('proj','Projects',prs.length)}${tb('inv','Invoices',invs.length)}</div>${panel}`;

function editClient(id){
  const c=S.clients.find(x=>x.id==id)||{},b0=c.billing||'oneoff',pr0=c.pricing||'ratecard',d=$('#dlg');
  const rates=(c.rates||[]).map(r=>({...r}));while(rates.length<3)rates.push({name:'',amount:''});
  const rr=r=>`<div class="rrow"><input class="rn" placeholder="Name" value="${esc(r.name)}"><input class="ra" type="number" min="0" placeholder="Rs" value="${esc(r.amount)}"></div>`;
  d.oninput=d.onchange=d.onkeydown=null;
  d.innerHTML=`<h3>${id?'Edit client':'New client'}</h3><label>Client name<input id="f-name" value="${esc(c.name)}"></label><label>Contact<input id="f-contact" value="${esc(c.contact)}"></label>
<label>Billing type<select id="f-bill">${opts(BL,b0)}</select><span id="f-hint" style="font-size:12px"></span></label><label id="f-prw">Pricing<select id="f-pr"></select></label>
<label id="f-amw"><span id="f-aml">Amount</span><input id="f-amt" type="number" min="0" value="${esc(c.amount||'')}"></label>
<div id="f-rc"><div class="lab" style="margin:0 0 6px">Rate card, up to 10</div><div id="f-rows">${rates.map(rr).join('')}</div><button class="g" id="f-add">Add rate</button></div>
<label style="margin-top:10px">Invoice reminder<select id="f-cyc">${opts(Object.entries(CYC),c.cycle||'project')}</select></label><div class="row"><button class="g" id="cx">Cancel</button><button id="ok">Save</button></div>`;
  const upd=chg=>{const b=$('#f-bill').value,pr=$('#f-pr'),hp=b=='variable'||b=='multi';
    if(hp)pr.innerHTML=opts(PRC(b),pr.value||pr0);
    $('#f-prw').style.display=hp?'':'none';$('#f-rc').style.display=hp&&pr.value=='ratecard'?'':'none';
    const am=b=='fixed'||b=='oneoff';$('#f-amw').style.display=am?'':'none';$('#f-aml').textContent=b=='fixed'?'Monthly amount':'Project fee';
    $('#f-hint').textContent=BLH[b];if(chg)$('#f-cyc').value=(b=='fixed'||b=='variable')?'monthly':'project'};
  upd();$('#f-bill').onchange=()=>upd(1);$('#f-pr').onchange=()=>upd();
  $('#f-add').onclick=()=>{const rows=d.querySelectorAll('.rrow');if(rows.length<10)$('#f-rows').insertAdjacentHTML('beforeend',rr({name:'',amount:''}));if(rows.length>=9)$('#f-add').style.display='none'};
  d.showModal();$('#f-name').focus();$('#cx').onclick=()=>d.close();
  $('#ok').onclick=()=>{const name=$('#f-name').value.trim();if(!name){$('#f-name').style.borderColor='var(--bad)';$('#f-name').focus();return}
    const b=$('#f-bill').value,hp=b=='variable'||b=='multi',pr=hp?$('#f-pr').value:'';
    const rates=hp&&pr=='ratecard'?[...d.querySelectorAll('.rrow')].map(r=>({name:r.querySelector('.rn').value.trim(),amount:+r.querySelector('.ra').value||0})).filter(r=>r.amount>0).map((r,i)=>({name:r.name||'Rate '+(i+1),amount:r.amount})).slice(0,10):[];
    const o={name,contact:$('#f-contact').value.trim(),billing:b,pricing:pr,amount:(b=='fixed'||b=='oneoff')?(+$('#f-amt').value||0):0,rates,cycle:$('#f-cyc').value};o.retainer=unp(o);
    d.close();if(id)Object.assign(c,o);else{c.id=uid();Object.assign(c,o);S.clients.push(c);cur=c.id;view='client';ct=null}save();toast('Client saved')};
}

function cloudAttach(){
  if(unsub)unsub();sv('Syncing…');
  unsub=dref().onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const has=S.clients.length||S.projects.length||S.entries.length;
    if(!snap.exists){if(has)cloudPush();else sv('✓ Synced');firstAttach=false;return}
    const d=snap.data(),cu=(d.meta||{}).updatedAt||0,lu=(S.meta||{}).updatedAt||0;
    if(cu>lu||!has){adopt(d)}
    else if(lu>cu){
      if(firstAttach)ask('This device has newer changes than your cloud copy. Upload them and replace the cloud copy? (No = load the cloud copy instead.)',()=>cloudPush(),()=>adopt(d));
      else cloudPush()}
    else sv('✓ Synced');
    firstAttach=false;
  },e=>sv('Sync error ('+(e.code||e.message)+')',1));
}
function cloudPush(){
  if(!fdb||!fuser)return;sv('Syncing…');const snap=JSON.parse(JSON.stringify(S));
  fq=fq.then(()=>dref().set(snap)).then(()=>sv('✓ Synced')).catch(e=>sv('Not synced ('+(e.code||e.message)+')',1));
}
